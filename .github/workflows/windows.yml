# SPDX-License-Identifier: GPL-3.0-or-later
name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: pwsh scripts/collect-licenses.ps1
      - run: npm run tauri build
      - name: Prepare versioned downloads
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/openshark.exe "release/AS-x11-$version.exe"
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName "release/AS-x11-$version-setup.exe"
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1).FullName "release/AS-x11-$version-x64.msi"
          git archive --format=zip --prefix="AS-x11-$version/" --output="release/AS-x11-$version-source.zip" HEAD
          if ($LASTEXITCODE) { throw 'Source archive failed' }
          Get-ChildItem release -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { '{0}  {1}' -f $_.Hash,(Split-Path $_.Path -Leaf) } | Set-Content release/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Publish permanent release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "AS x11 $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
          fi
